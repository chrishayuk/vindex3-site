name: Deploy vindex3.org

on:
  push:
    branches: [main]
    # The archive step commits back the first-capture dates it learns. That
    # commit touches nothing else and must not start another deploy.
    paths-ignore: [src/data/archive.json]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ask coverage suite gates the deploy: a question that
      # silently stops resolving never ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image carries the commit it was built from, so every page can
      # say what produced it.
      - run: flyctl deploy --remote-only --build-arg GIT_COMMIT=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y-%m-%d)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Tell participating search engines the site changed. The key file
      # lives in public/; IndexNow accepts the sitemap's URL list.
      - name: IndexNow ping
        run: |
          sleep 30
          curl -s "https://vindex3.org/sitemap.xml" -o sitemap.xml || exit 0
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())[:500]
          body = json.dumps({
              "host": "vindex3.org",
              "key": "3b26ce728d64a831e8eb01b94288dc60",
              "keyLocation": "https://vindex3.org/3b26ce728d64a831e8eb01b94288dc60.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("indexnow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
          except Exception as e:
              print("indexnow skipped:", e)
          PY
      # PUBLISH -> COMMIT -> ARCHIVE. IndexNow tells search engines the page
      # changed; this asks an independent party to keep a copy of it, and
      # records when that party FIRST saw it. Without IA credentials the step
      # still runs, reads the public Wayback index and records what is already
      # there, so it is never blocked on a secret.
      - name: Check archive configuration
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "::warning::New captures need IA_ACCESS_KEY and IA_SECRET_KEY repository secrets. This run only resolves existing captures."
          fi
      - name: Archive the citable objects
        timeout-minutes: 15
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: npm run archive -- --limit 6
      # A first capture is evidence, so it is committed rather than cached:
      # the date belongs in the repository's history next to the chapter it
      # corroborates. It reaches the site on the next deploy.
      - name: Record the first captures
        run: |
          git diff --quiet src/data/archive.json && { echo "No new captures."; exit 0; }
          git config user.name "vindex3-site"
          git config user.email "noreply@vindex3.org"
          git add src/data/archive.json
          git commit -m "Record independent archive captures"
          git pull --rebase origin main
          git push origin HEAD:main
