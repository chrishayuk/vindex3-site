name: Deploy vindex3.org

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The ask coverage suite gates the deploy: a question that
      # silently stops resolving never ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image carries the commit it was built from, so every page can
      # say what produced it.
      - run: flyctl deploy --remote-only --build-arg GIT_COMMIT=${{ github.sha }} --build-arg BUILD_DATE=$(date -u +%Y-%m-%d)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Tell participating search engines the site changed. The key file
      # lives in public/; IndexNow accepts the sitemap's URL list.
      - name: IndexNow ping
        run: |
          sleep 30
          curl -s "https://vindex3.org/sitemap.xml" -o sitemap.xml || exit 0
          python3 - <<'PY'
          import json, re, urllib.request
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())[:500]
          body = json.dumps({
              "host": "vindex3.org",
              "key": "3b26ce728d64a831e8eb01b94288dc60",
              "keyLocation": "https://vindex3.org/3b26ce728d64a831e8eb01b94288dc60.txt",
              "urlList": urls,
          }).encode()
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("indexnow:", urllib.request.urlopen(req, timeout=30).status, len(urls), "urls")
          except Exception as e:
              print("indexnow skipped:", e)
          PY
